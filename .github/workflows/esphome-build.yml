name: Build ESPHome Firmware

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Build firmware
        run: |
          esphome compile esp32-s3-waveshare-7in.yaml

      - name: Copy firmware files
        run: |
          mkdir -p firmware
          cp .esphome/build/waveshare-esp32-s3-7in/.pioenvs/waveshare-esp32-s3-7in/firmware.bin firmware/waveshare-esp32-s3-7in.bin || true
          cp .esphome/build/waveshare-esp32-s3-7in/.pioenvs/waveshare-esp32-s3-7in/firmware.elf firmware/waveshare-esp32-s3-7in.elf || true
          cp .esphome/build/waveshare-esp32-s3-7in/.pioenvs/waveshare-esp32-s3-7in/partitions.bin firmware/partitions.bin || true
          cp .esphome/build/waveshare-esp32-s3-7in/.pioenvs/waveshare-esp32-s3-7in/bootloader.bin firmware/bootloader.bin || true

      - name: Get short SHA
        id: slug
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Get branch name
        id: branch
        run: echo "branch_name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-firmware-${{ steps.slug.outputs.sha_short }}
          path: firmware/
          retention-days: 30

      - name: Delete old releases
        continue-on-error: true
        run: |
          gh release list --limit 100 | grep "firmware-" | awk '{print $1}' | tail -n +6 | xargs -I {} gh release delete {} -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release with Direct Download Link
        uses: softprops/action-gh-release@v1
        with:
          tag_name: firmware-${{ steps.branch.outputs.branch_name }}-${{ steps.slug.outputs.sha_short }}
          name: "Firmware: ${{ steps.branch.outputs.branch_name }} (${{ steps.slug.outputs.sha_short }})"
          files: firmware/*
          draft: false
          prerelease: true
          body: |
            ## 📥 Direct Download Links

            **Main Firmware File:**
            [⬇️ Download waveshare-esp32-s3-7in.bin](https://github.com/${{ github.repository }}/releases/download/firmware-${{ steps.branch.outputs.branch_name }}-${{ steps.slug.outputs.sha_short }}/waveshare-esp32-s3-7in.bin)

            **All Files:**
            - [waveshare-esp32-s3-7in.bin](https://github.com/${{ github.repository }}/releases/download/firmware-${{ steps.branch.outputs.branch_name }}-${{ steps.slug.outputs.sha_short }}/waveshare-esp32-s3-7in.bin) - Main firmware
            - [bootloader.bin](https://github.com/${{ github.repository }}/releases/download/firmware-${{ steps.branch.outputs.branch_name }}-${{ steps.slug.outputs.sha_short }}/bootloader.bin) - Bootloader
            - [partitions.bin](https://github.com/${{ github.repository }}/releases/download/firmware-${{ steps.branch.outputs.branch_name }}-${{ steps.slug.outputs.sha_short }}/partitions.bin) - Partition table

            ---

            **Branch:** `${{ steps.branch.outputs.branch_name }}`
            **Commit:** `${{ steps.slug.outputs.sha_short }}`
            **Build:** #${{ github.run_number }}

            ## 🔧 How to Flash

            1. Download the main firmware file above
            2. Go to https://web.esphome.io/
            3. Connect your ESP32-S3 via USB
            4. Click "Install" and upload the .bin file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
